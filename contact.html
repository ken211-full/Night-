<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us | YourBrand</title>

    <!-- EMAILJS -->
    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

    <style>
      /* RESET */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f9f9f9;
        color: #333;
      }

      /* HEADER */
      header {
        background-color: #0d47a1;
        color: white;
        padding: 15px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      header h1 {
        margin: 0;
      }

      nav ul {
        list-style: none;
        display: flex;
        gap: 20px;
        margin: 0;
        padding: 0;
      }

      nav a {
        text-decoration: none;
        color: white;
        font-weight: bold;
      }

      nav a:hover {
        display: block;
        transform: translateY(-1px);
        text-decoration: underline;
      }

      /* CONTACT SECTION */
      .contact-section {
        padding: 80px 8%;
      }

      .contact-container {
        display: flex;
        gap: 50px;
        background: white;
        padding: 50px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        animation: fadeIn 0.8s ease forwards;
      }

      /* INFO */
      .contact-info {
        flex: 1;
      }

      .contact-info h2 {
        font-size: 32px;
        margin-bottom: 20px;
      }

      .contact-info p {
        margin-bottom: 30px;
        line-height: 1.6;
      }

      .info-item {
        margin-bottom: 15px;
      }

      .social-links {
        margin-top: 30px;
      }

      .social-links a {
        margin-right: 15px;
        text-decoration: none;
        color: #111;
        font-weight: 600;
      }

      /* FORM */
      .contact-form {
        flex: 1;
      }

      input,
      textarea {
        width: 100%;
        padding: 12px;
        margin-bottom: 20px;
        border: 1px solid #ddd;
        border-radius: 8px;
      }

      button {
        width: 100%;
        padding: 14px;
        border: none;
        background: gold;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
      }

      button:hover {
        background: #111;
        color: white;
      }

      /* MAP */
      .map-section {
        margin-top: 60px;
      }

      .map-section iframe {
        width: 100%;
        height: 400px;
        border-radius: 15px;
        border: 0;
      }

      /* FOOTER */
      footer {
        background-color: #0d47a1;
        color: white;
        text-align: center;
        padding: 30px;
      }

      .footer-content {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .social-links a {
        color: white;
        text-decoration: none;
        margin: 0 10px;
        font-weight: bold;
      }

      .social-links a:hover {
        text-decoration: underline;
      }

      /* WHATSAPP */
      .whatsapp-float {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: #25d366;
        color: white;
        font-size: 24px;
        padding: 15px;
        border-radius: 50%;
        text-decoration: none;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      }

      /* ========================
   RESPONSIVE DESIGN
======================== */

      /* Tablet */
      @media (max-width: 992px) {
        .products {
          padding: 0 40px 80px;
          gap: 30px;
        }

        header {
          padding: 20px 30px;
        }
      }

      /* Mobile */
      @media (max-width: 600px) {
        header {
          flex-direction: column;
          gap: 15px;
        }

        header ul {
          flex-direction: column;
          gap: 10px;
          align-items: center;
        }

        .page-title h1 {
          font-size: 20px;
        }

        .products {
          padding: 0 18px 40px;
        }

        .filters button {
          width: 80%;
          margin-bottom: 10px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Night Fashion</h1>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="shop.html">Shop</a></li>
          <!--  <li><a href="shop.html">Men</a></li>
          <li><a href="shop.html">Women</a></li> -->

          <li>
            <a href="checkout.html">Cart ( <span id="cart-count">0</span>)</a>
          </li>
          <li><a href="product.html">Description</a></li>
        </ul>
      </nav>
    </header>

    <section class="contact-section">
      <div class="contact-container">
        <div class="contact-info">
          <h2>Get In Touch</h2>
          <p>Send us a message anytime.</p>

          <div class="info-item">📍 Your City</div>
          <div class="info-item">📧 your@email.com</div>
          <div class="info-item">📞 +123456789</div>

          <div class="social-links">
            <a href="#">YouTube</a>
            <a href="#">Instagram</a>
            <a href="#">TikTok</a>
          </div>
        </div>

        <div class="contact-form">
          <form id="contactForm">
            <input
              type="text"
              name="user_name"
              placeholder="Full Name"
              required
            />
            <input
              type="email"
              name="user_email"
              placeholder="Email Address"
              required
            />
            <input type="text" name="subject" placeholder="Subject" required />
            <textarea
              name="message"
              rows="5"
              placeholder="Your Message"
              required
            ></textarea>
            <button type="submit">Send Message</button>
          </form>
        </div>
      </div>

      <!-- GOOGLE MAP -->
      <div class="map-section">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.019622..."
        >
        </iframe>
      </div>
    </section>

    <footer>
      <div class="footer-content">
        <p>Follow Us</p>

        <div class="social-links">
          <a href="https://youtube.com" target="_blank"
            ><img
              src="/icon/youtube.png"
              style="width: 30px"
              style="height: auto"
              alt="Youtube"
          /></a>
          <a href="https://instagram.com" target="_blank"
            ><img
              src="/icon/instagram.png"
              style="width: 30px"
              style="height: auto"
              alt="instagram"
          /></a>
          <a href="https://wa.me/211XXXXXXXXX" target="_blank"
            ><img
              src="/icon/whatsapp.png"
              style="width: 30px"
              style="height: auto"
              alt="WhatApp"
          /></a>
          <a href="https://tiktok.com" target="_blank"
            ><img
              src="/icon/tik-tok.png"
              style="width: 30px"
              style="height: auto"
              alt="Tiktok"
          /></a>
          <a href="https://github-sign.com" target="_blank"
            ><img
              src="/icon/github-sign.png"
              style="width: 30px"
              style="height: auto"
              alt="GitHub"
          /></a>
          <a href="https://linkedin.com" target="_blank"
            ><img
              src="/icon/linkedin.png"
              style="width: 30px"
              style="height: auto"
              alt="Linkedin"
          /></a>
        </div>
        <p>© 2026 Night Fashion | All Rights Reserved</p>
      </div>
    </footer>

    <!-- WHATSAPP BUTTON -->
    <a href="https://wa.me/+211921808311" class="whatsapp-float" target="_blank"
      >💬</a
    >

    <script>
      (function () {
        emailjs.init("YOUR_PUBLIC_KEY");
      })();

      document
        .getElementById("contactForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          emailjs
            .sendForm("YOUR_SERVICE_ID", "YOUR_TEMPLATE_ID", this)
            .then(function () {
              alert("Message Sent Successfully 🔥");
            })
            .catch(function () {
              alert("Failed to send message");
            });

          this.reset();
        });
    </script>
  </body>
</html>
